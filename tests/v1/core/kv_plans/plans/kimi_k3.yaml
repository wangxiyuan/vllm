  tp1-dspark:
  - kind: MambaSpec
    layers: ['language_model.model.layers.{0-88:4}.self_attn']
  - kind: MambaSpec
    layers: ['language_model.model.layers.{1-89:4}.self_attn']
  - kind: MambaSpec
    layers: ['language_model.model.layers.{2-90:4}.self_attn']
